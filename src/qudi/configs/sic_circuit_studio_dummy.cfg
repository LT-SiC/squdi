# Hardware-free configuration for the SiC Circuit Studio logic module.
global:
    startup: [sic_circuit_studio_logic]

gui: {}

logic:
    sic_circuit_studio_logic:
        module.Class: 'sic_circuit_studio.sic_circuit_studio_logic.SicCircuitStudioLogic'
        options:
            port: 8765

hardware: {}
