    #         scanner_position_ranges: [[0e-6, 100e-6], [0e-6, 100e-6], [-50e-6, 50e-6], [-10, 10]]
    #         scanner_counter_channels: ['fluorescence']
    #         scanner_ai_channels: []
    nicard_6323:
        module.Class: 'ni_x_series.national_instruments_x_series.NationalInstrumentsXSeries'
        options:
            photon_sources:
                - '/Dev1/PFI0'
            #    - '/Dev1/PFI9'
            clock_channel: '/Dev1/Ctr0'
            default_clock_frequency: 100 # optional, in Hz
            counter_channels:
                - '/Dev1/Ctr1'
            counter_ai_channels:
                - '/Dev1/AI0'
            counter_voltage_range: [-10, 10]
            default_scanner_clock_frequency: 100 # optional, in Hz
            scanner_clock_channel: '/Dev1/Ctr2'
            pixel_clock_channel: '/Dev1/PFI6'
            scanner_ao_channels:
                - '/Dev1/AO0'
                - '/Dev1/AO1'
                - '/Dev1/AO2'
                - '/Dev1/AO3'
            # scanner_ai_channels:
            #     - '/Dev1/AI1'
            scanner_counter_channels:
                - '/Dev1/Ctr3'
            scanner_voltage_ranges:
                - [-10, 10]
                - [-10, 10]
                - [0, 10]
                - [-10, 10]
            scanner_position_ranges:
                - [-104.86e-6, 104.86e-6]
                - [-104.86e-6, 104.86e-6]
                - [0, 15e-6]
                - [-10, 10]
            trapezoid_rotation_correction: "np.pi/4"
            scaling_correction_a: "1"
            scaling_correction_b: "1/np.sqrt(2)" 
            rotation_correction: "np.pi/4" #1 
            scaling_correction_x: "1"
            scaling_correction_y: "1"

            odmr_trigger_channel: '/Dev1/PFI7'

            gate_in_channel: '/Dev1/PFI9'
            default_samples_number: 50
            max_counts: 3e7
            read_write_timeout: 10
            counting_edge_rising: True

    timetagger:
        module.Class: 'swabian_instruments.timetagger_api.TT'
        #module.Class: 'swabian.timetagger_counter.TT'
        options:
            serial: 1740000JG9
            hist:
                #click_channel: 1
                channels: [1]
                #start_channel: 4
                trigger_channel: 4
                #next_channel: 12 #negative slope of channel 4
                #sync_channel: 7
                binwidth: 200
                number_of_bins: 100
                #n_histograms: 1
                
            time_diff:
                click_channel: 1
                start_channel: 4
                next_channel: 12 #negative slope of channel 4
                sync_channel: 7
                binwidth: 1000
                n_bins: 30
                n_histograms: 1

            corr:
                channel_start: 1
                channel_stop: 2
                binwidth: 1000
                number_of_bins: 1000
                ctrate:
                channels: [1,2]

            counter:
                channels: [1,2]
                bins_width: 1000000000 #1ms
                n_values: 40

            combiner:
                channels: [3,4]

            test_channels: [] # [1,2,3,4,5,6,7]#[1,2, 4, -4]

            channels_params:
                1:
                    #delay: 0
                    trigger_level: 0.08
                    dead_time: 70000
                2:
                    trigger_level: 0.08

            count_between_markers:
                click_channel: 1
                begin_channel: 4
                end_channel: 7
                n_values: 7

    
    wavemeter_proxy:
        #module.Class: 'wavemeter.high_finesse_proxy_dummy.HighFinesseProxy'
        module.Class: 'wavemeter.high_finesse_proxy.HighFinesseProxy'
        options:
            watchdog_interval: 1.0  # how often the watchdog checks for errors/changes in s
            
    wavemeter:
        #module.Class: 'wavemeter.high_finesse_wavemeter_dummy.HighFinesseWavemeter'
        module.Class: 'wavemeter.high_finesse_wavemeter.HighFinesseWavemeter'
        connect:
            proxy: wavemeter_proxy
        options:
            channels:
                620_laser:
                    switch_ch: 1    # channel on the wavemeter switch
                    unit: 'nm'    # wavelength (m) or frequency (Hz)
                    exposure: 1  # exposure time in ms, optional
