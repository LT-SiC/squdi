    wavemeter_proxy:
        module.Class: 'wavemeter.high_finesse_proxy_dummy.HighFinesseProxy'
        options:
            watchdog_interval: 1.0  # how often the watchdog checks for errors/changes in s
            simulated_wavelengths_nm:  # optional, base wavelength per switch channel
                1: 620.0
                2: 917.0

    wavemeter:
        module.Class: 'wavemeter.high_finesse_wavemeter_dummy.HighFinesseWavemeter'
        connect:
            proxy: wavemeter_proxy
        options:
            channels:
                620_laser:
                    switch_ch: 1    # channel on the wavemeter switch
                    unit: 'nm'    # wavelength (m) or frequency (Hz)
                    exposure: 1  # exposure time in ms, optional