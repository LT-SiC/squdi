            awg: 'm8190a'
            pulsestreamer: 'pulsestreamer'
        options:
            awg_name: '2g'
            ps_name: 'ps'
            debug_mode: False       # True: no communication with the awgs
        # Settings needs further debugging
        # settings:#Everything below is optional; the defaults are the values of the legacy settings.py.
        #     master_awg: '2g'
        #     master_trigger_channel: 1
        #     restore_awg_settings: True
        #     ch_dict_full: {'2g': [1, 2], 'ps': [1]}
        #     ch_dict_awgs: {'2g': [1, 2]}
            # amplifier_power: {'2g': {1: 1.1, 2: 2.1}}
            # slave_start_delay: 795.0
            # slave_trigger_safety_length_mus: 1.024
            # trigger_delay_length_mus: 0.864
            # trigger_length_mus: 0.864
            # max_sine_avg_power: {'2g': {1: null, 2: null}}
            # marker_alias:
            #     gateAWG: ['2g', 1, 'smpl', None]
            #     gate: ['2g', 1, 'smpl', None]
            #     gateMW: ['2g', 2, 'smpl', None]
            #     memory: ['2g', 2, 'sync', None]
            #     closeRF: ['ps', 1, 'closeRF', '0']
            #     A2: ['ps', 1, 'A2', '1']
            #     repump: ['ps', 1, 'repump', '2']
            #     laser: ['ps', 1, 'laser', '3']
            #     A1: ['ps', 1, 'A1', '5']
            #     shutter: ['ps', 1, 'shutter', '6']
            #     gateRF: ['ps', 1, 'gateRF', '7']
            
    transitiontrackerlogic:
        module.Class: 'transition_tracker.TransitionTracker'
        connect:
            mcas_dict_holder: 'mcas_dict_holder'
            # rabi_logic: 'rabilogic'
            # odmr_logic: 'odmrlogic'
            # ple_logic: 'laserscannerlogic'
            # powerstabilization_logic: 'powerstabilizationlogic'
        options:
            spin_number: 1.5
            current_spins: '29si5' # '29si5,13c21' # needs to have a "hf_*.txt" file in transition_tracker_log
            e_gate_dur: 0.128 # µs

    
    gatedcounterlogic:
        module.Class: 'gated_counter_logic.GatedCounter'
        connect:
            mcas_dict_holder: 'mcas_dict_holder'
            fastcounter: 'timetagger_dummy'

    queue_logic:
        module.Class: 'queue.queue_logic.QueueLogic'      # module path of your queue_logic.py, then the class name
        connect:
            mcas_dict_holder: 'mcas_dict_holder'
            transition_tracker: 'transitiontrackerlogic'
            gated_counter: 'gatedcounterlogic'
            optimize_logic: 'scanning_optimize_logic'
            #odmr_refocus_logic: 'odmr_refocus_logic'
        
    odmr_refocus_logic:
        module.Class: 'queue.odmr_refocus.ODMRRefocuser'
        connect:
            queue_logic: 'queue_logic'
        options:
           odmr_refocus_interval: 3600 # s, 0: off
           odmr_refocus_ranges: [[2.5, 0.15], [4, 0.2]] # [[span, step], ...] in MHz
           odmr_refocus_parameters: {sweeps: 2, trans: ['L', 'R', 'C']}
           odmr_refocus_on_activation: False
           # odmr_refocus_plot: False

    ple_scanner_logic:
        module.Class: 'ple.ple_scanner_logic.PLEScannerLogic'
        options:
            scan_axis: 'a' #'Laser_620_freq'
            max_history_length: 10
            max_scan_update_interval: 2
            position_update_interval: 1
            channel: 'sum'
            # frequency_calibration_poly_degree: 1
            # frequency_calibration_points: 20
        connect:
            scanner: scanner_dummy
            #scanner: tt_laser_scanner
            wavemeter: wavemeter

    ple_data_logic:
        module.Class: 'ple.data_logic.PleDataLogic'
        options:
            max_history_length: 10
        connect:
            scan_logic: ple_scanner_logic

    ple_optimize_logic:
        module.Class: 'ple.optimize_logic.PLEOptimizeScannerLogic'
        connect:
            scan_logic: ple_scanner_logic

    wavelogger_logic:
        module.Class: "wavemeter_logger_logic.WavemeterLoggerLogic"
        connect:
            wavemeter: "wavemeter"
            timetagger: 'timetagger_dummy'

    timetagger_logic:
        module.Class: 'timetagger_logic.TimeTaggerLogic'
        connect:
            timetagger: 'timetagger_dummy'
        
    web_api_logic:
        module.Class: 'qudi_web_api.web_api_logic.WebApiLogic'
        connect:
            queue_logic: 'queue_logic'
        options:
            host: '0.0.0.0'
            port: 8000
            measurement_directory: 'C:/Users/ehess/Desktop/Messungen/qudi_api'
            api_token: 'one_plus_one_is_three' # shared secret used to authenticate requests

