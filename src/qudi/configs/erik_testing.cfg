#  Example Qudi configuration file.
#  The recommended path for user specific files is C:\Users\<user_name>\qudi\config

global:
    # list of modules to load when starting
    startup_modules: []
    #startup_modules: [TransitionTracker]
    #startup_modules: [queue_gui, scanner_gui]

    # Module server configuration for accessing qudi GUI/logic/hardware modules from remote clients
    remote_modules_server:
        address: 'localhost'
        port: 12345

    # Server port for serving the active qudi module namespace locally (localhost).
    # Used by e.g. the Qudi jupyter kernel.
    namespace_server_port: 18861

    # If this flag is set (True), all arguments passed to qudi module APIs from remote
    # (jupyter notebook, qudi console, remote modules) will be wrapped and passed "per value"
    # (serialized and de-serialized). This is avoiding a lot of inconveniences with using numpy in
    # remote clients.
    # If you do not want to use this workaround and know what you are doing, you can disable this
    # feature by setting this flag to False.
    force_remote_calls_by_value: True

    # Qss stylesheet for controlling the appearance of the GUIs.
    # Absolute path or relative to qudi.artwork.styles
    stylesheet: 'qdark.qss'

    # Default root directory for measurement data storage. All eventual data sub-directories should
    # be contained within this directory. This is not enforced, just convention.
    # The fallback directory is <user home>/qudi/Data/
    # default_data_dir: C:\Users\neverhorst\qudi\Data

    # Save data to daily data sub-directories by default
    daily_data_dirs: True

gui:
    queue_gui:
        module.Class: 'queue.Queue.QueueGui'
        connect:
            queue_logic: 'queue_logic'

    counter:
        module.Class: 'timetagger.timetagger.TTGui'
        connect:
            timetaggerlogic: 'timetagger_logic'    

    confocal_gui:
        module.Class: 'scanning.scannergui.ScannerGui'
        # options:
        #     default_position_unit_prefix: null  # optional, use unit prefix characters, e.g. 'u' or 'n'
        #     min_crosshair_size_fraction: 0.02   # minimum crosshair size as fraction of the displayed scan range
        connect:
            scanning_logic: scanning_probe_logic
            data_logic: scanning_data_logic
            optimize_logic: scanning_optimize_logic

    ple_gui:
        module.Class: 'ple.ple_gui.PLEScanGui'
        connect:
            scannerlogic: ple_scanner_logic
            optimizerlogic: ple_optimize_logic
            data_logic: ple_data_logic

    TransitionTracker:
        module.Class: 'transition_tracker.transition_tracker_gui.TransitionTrackerGui'
        connect:
            transition_tracker_logic: 'transitiontrackerlogic'

    wavemeter_gui:
        module.Class: 'wavemeter.wavemeterloggui.WavemeterLogGui'
        connect:
            wavemeterloggerlogic: 'wavelogger_logic'



logic:
    scanning_probe_logic:
        module.Class: 'scanning.probe_logic.ScanningProbeLogic'
        options:
            max_history_length: 20
            max_scan_update_interval: 2
            position_update_interval: 1
            backwards_line_resolution: 100
        connect:
            scanner: nicard_6323

    scanning_data_logic:
        module.Class: 'scanning.data_logic.ScanningDataLogic'
        options:
            max_history_length: 20
        connect:
            scan_logic: scanning_probe_logic

    scanning_optimize_logic:
        module.Class: 'scanning.optimize_logic.ScanningOptimizeLogic'
        connect:
            scan_logic: scanning_probe_logic

    poi_manager_logic:
        module.Class: 'scanning.poi_manager_logic.PoiManagerLogic'
        connect:
            scanning_logic: 'scanning_probe_logic'
            optimize_logic: 'scanning_optimize_logic'
            data_logic: 'scanning_data_logic'

    mcas_dict_holder:
        module.Class: 'mcas_holder_logic.mcas_dict_holder'
        connect:
            awg: 'm8190a'
            pulsestreamer: 'pulsestreamer'
        options:
            awg_name: '2g'
            ps_name: 'ps'
            debug_mode: False       # True: no communication with the awgs
        # Settings needs further debugging
        # settings:#Everything below is optional; the defaults are the values of the legacy settings.py.
        #     master_awg: '2g'
        #     master_trigger_channel: 1
        #     restore_awg_settings: True
        #     ch_dict_full: {'2g': [1, 2], 'ps': [1]}
        #     ch_dict_awgs: {'2g': [1, 2]}
            # amplifier_power: {'2g': {1: 1.1, 2: 2.1}}
            # slave_start_delay: 795.0
            # slave_trigger_safety_length_mus: 1.024
            # trigger_delay_length_mus: 0.864
            # trigger_length_mus: 0.864
            # max_sine_avg_power: {'2g': {1: null, 2: null}}
            # marker_alias:
            #     gateAWG: ['2g', 1, 'smpl', None]
            #     gate: ['2g', 1, 'smpl', None]
            #     gateMW: ['2g', 2, 'smpl', None]
            #     memory: ['2g', 2, 'sync', None]
            #     closeRF: ['ps', 1, 'closeRF', '0']
            #     A2: ['ps', 1, 'A2', '1']
            #     repump: ['ps', 1, 'repump', '2']
            #     laser: ['ps', 1, 'laser', '3']
            #     A1: ['ps', 1, 'A1', '5']
            #     shutter: ['ps', 1, 'shutter', '6']
            #     gateRF: ['ps', 1, 'gateRF', '7']
            
    transitiontrackerlogic:
        module.Class: 'transition_tracker.TransitionTracker'
        connect:
            mcas_dict_holder: 'mcas_dict_holder'
            # rabi_logic: 'rabilogic'
            # odmr_logic: 'odmrlogic'
            # ple_logic: 'laserscannerlogic'
            # powerstabilization_logic: 'powerstabilizationlogic'
        options:
            spin_number: 1.5
            current_spins: '29si5' # '29si5,13c21' # needs to have a "hf_*.txt" file in transition_tracker_log
            e_gate_dur: 0.128 # µs

    
    gatedcounterlogic:
        #module.Class: 'gated_counter_logic_qinu.GatedCounter'
        module.Class: 'gated_counter_logic.GatedCounter'
        connect:
            mcas_dict_holder: 'mcas_dict_holder'
            fastcounter: 'timetagger'

    queue_logic:
        module.Class: 'queue.queue_logic.QueueLogic'      # module path of your queue_logic.py, then the class name
        connect:
            mcas_dict_holder: 'mcas_dict_holder'
            transition_tracker: 'transitiontrackerlogic'
            gated_counter: 'gatedcounterlogic'
            optimize_logic: 'scanning_optimize_logic'

    ple_scanner_logic:
        module.Class: 'ple.ple_scanner_logic.PLEScannerLogic'
        options:
            scan_axis: 'a' #'Laser_620_freq'
            max_history_length: 10
            max_scan_update_interval: 2
            position_update_interval: 1
            channel: 'sum'
            # frequency_calibration_poly_degree: 1
            # frequency_calibration_points: 20
        connect:
            scanner: nicard_6323
            #scanner: tt_laser_scanner
            wavemeter: wavemeter

    ple_data_logic:
        module.Class: 'ple.data_logic.PleDataLogic'
        options:
            max_history_length: 10
        connect:
            scan_logic: ple_scanner_logic

    ple_optimize_logic:
        module.Class: 'ple.optimize_logic.PLEOptimizeScannerLogic'
        connect:
            scan_logic: ple_scanner_logic

    wavelogger_logic:
        module.Class: "wavemeter_logger_logic.WavemeterLoggerLogic"
        connect:
            wavemeter: "wavemeter"
            timetagger: 'timetagger'

    timetagger_logic:
        module.Class: 'timetagger_logic.TimeTaggerLogic'
        connect:
            timetagger: 'timetagger'

hardware:
    m8190a:
        module.Class: 'keysight.m8190a.KeysightM8190A'
        options:
            address: 'TCPIP0::localhost::inst0::INSTR'
            name: '2g'
            channels: [1, 2]
            settings_folder: 'C:/src/squdi/src/qudi/hardware/keysight/hardware_settings'
    pulsestreamer:
        module.Class: 'swabian.pulse_streamer_mcas.PulseStreamerMcas'
        options:
            ip: '129.69.46.36'
            clock_channels: [4]
            analog_volt: 1.0

    # scanner_dummy:
    #     module.Class: 'ni_x_series.ni_x_series_scanner_dummy.NiXSeriesScannerDummy'
    #     options:
    #         scanner_ao_channels: ['/Dev1/AO0', '/Dev1/AO1', '/Dev1/AO2', '/Dev1/AO3']   # 1-4 Kanäle -> x, y, z, a
